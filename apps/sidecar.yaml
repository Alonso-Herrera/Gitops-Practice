apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-visual-logs
  namespace: default
  labels:
    app: nginx-visual
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-visual
  template:
    metadata:
      labels:
        app: nginx-visual
    spec:
      containers:
      - name: nginx-server
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: compartido-logs
          mountPath: /var/log/nginx
        - name: reporte-html
          mountPath: /usr/share/nginx/html/dashboard

      - name: sidecar-recolector
        image: allinurl/goaccess:latest
        args: ["--log-file=/var/log/nginx/access.log", "--log-format=COMBINED", "--real-time-html", "--output=/html/index.html"]
        volumeMounts:
        - name: compartido-logs
          mountPath: /var/log/nginx
        - name: reporte-html
          mountPath: /html

      volumes:
      - name: compartido-logs
        emptyDir: {}
      - name: reporte-html
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-nginx-visual
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31080
  selector:
    app: nginx-visual

