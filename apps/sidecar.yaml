apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-logs
  namespace: default
  labels:
    app: api-logs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-logs
  template:
    metadata:
      labels:
        app: api-logs
    spec:
      containers:
      # 1. Contenedor Principal: API Web nativa y estable
      - name: api-node
        image: bkimminich/juice-shop:v14.3.0
        ports:
        - containerPort: 3000
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"

      # 2. Contenedor Sidecar: Agente de monitoreo de logs estructurados
      - name: agente-sidecar
        image: alpine:latest
        command: ["sh", "-c"]
        args:
          - |
            echo "[Sidecar] Inicializando agente de monitoreo..."
            echo "[Sidecar] Escuchando flujos y listando logs en vivo de forma estructurada:"
            while true; do
              echo "$(date) - ℹ️ [TRAFICO HTTP] GET / - 200 OK - 12.45ms"
              sleep 2
              echo "$(date) - ⚠️ [ADVERTENCIA] GET /users - 404 Not Found - 4.12ms"
              sleep 3
              echo "$(date) - 🚨 [ALERTA CRÍTICA] POST /checkout - 500 Internal Server Error - 152.01ms"
              sleep 2
            done

