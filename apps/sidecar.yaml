apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-visual-logs
  namespace: default
  labels:
    app: nginx-visual
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-visual
  template:
    metadata:
      labels:
        app: nginx-visual
    spec:
      containers:
      - name: nginx-server
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: compartido-logs
          mountPath: /var/log/nginx

      - name: sidecar-dashboard
        image: allinone/goaccess:latest
        ports:
        - containerPort: 7890
        args: ["--log-file=/var/log/nginx/access.log", "--log-format=COMBINED", "--real-time-html", "--output=/html/index.html"]
        volumeMounts:
        - name: compartido-logs
          mountPath: /var/log/nginx
        - name: reporte-html
          mountPath: /html

      - name: web-dashboard
        image: nginx:alpine
        ports:
        - containerPort: 8080
        command: ["/bin/sh", "-c", "sed -i 's/80;/8080;/g' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
        volumeMounts:
        - name: reporte-html
          mountPath: /usr/share/nginx/html

      volumes:
      - name: compartido-logs
        emptyDir: {}
      - name: reporte-html
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: servicio-nginx-visual
  namespace: default
spec:
  type: NodePort
  ports:
  - name: web-nginx
    port: 80
    targetPort: 80
    nodePort: 31080
  - name: web-dashboard
    port: 8080
    targetPort: 8080
    nodePort: 31088
  selector:
    app: nginx-visual

